profile: "1m"
layout: "per_tenant" # "per_tenant" (official submission) | "single" (baseline)

tenant_db:
  host: "localhost"
  port: 5432
  user: "postgres"
  password: "postgres"
  name_prefix_1m: "tenant_"
  name_prefix_10m: "t10m_"
  count: 100

profiles:
  "1m":
    layout: "per_tenant"
    main_db_url: "postgresql://postgres:postgres@localhost:5432/shop"
    rollup_db_url: "postgresql://postgres:postgres@localhost:5433/rollup_1m"
    main_db_name: "shop"
    rollup_db_name: "rollup_1m"
    tenant_prefix: "tenant_"
  "10m":
    layout: "per_tenant"
    main_db_url: "postgresql://postgres:postgres@localhost:5432/shop_10m"
    rollup_db_url: "postgresql://postgres:postgres@localhost:5433/rollup_10m"
    main_db_name: "shop_10m"
    rollup_db_name: "rollup_10m"
    tenant_prefix: "t10m_"
  "single_1m":
    layout: "single"
    main_db_url: "postgresql://postgres:postgres@localhost:5432/shop"
    rollup_db_url: "postgresql://postgres:postgres@localhost:5433/rollup_1m"
    main_db_name: "shop"
    rollup_db_name: "rollup_1m"
  "single_10m":
    layout: "single"
    main_db_url: "postgresql://postgres:postgres@localhost:5432/shop_10m"
    rollup_db_url: "postgresql://postgres:postgres@localhost:5433/rollup_10m"
    main_db_name: "shop_10m"
    rollup_db_name: "rollup_10m"

database:
  main_db_url: "postgresql://postgres:postgres@localhost:5432/shop"
  rollup_db_url: "postgresql://postgres:postgres@localhost:5433/rollup_1m"
  main_1m: "postgresql://postgres:postgres@localhost:5432/shop"
  main_10m: "postgresql://postgres:postgres@localhost:5432/shop_10m"
  rollup_1m: "postgresql://postgres:postgres@localhost:5433/rollup_1m"
  rollup_10m: "postgresql://postgres:postgres@localhost:5433/rollup_10m"

schema:
  tables:
    tenants: "tenants"
    customers: "customers"
    products: "products"
    orders: "orders"
    order_items: "order_items"
    outbox: "outbox"

  columns:
    tenant_id: "tenant_id"
    order_id: "order_id"
    customer_id: "customer_id"
    item_id: "item_id"
    product_id: "product_id"
    category: "category"
    status: "status"
    total: "total"
    price: "price"
    qty: "qty"
    created_at: "created_at"
    updated_at: "updated_at"

business_rules:
  excluded_statuses:
    - "canceled"
    - "unavailable"
  all_statuses:
    - "created"
    - "approved"
    - "invoiced"
    - "processing"
    - "shipped"
    - "delivered"
    - "canceled"
    - "unavailable"

rollups:
  orders_hour:
    table: "rollup_orders_hour"
    dimensions:
      - "tenant_id"
      - "hour"
      - "status"
    metrics:
      - "order_count"
      - "revenue"
  product_day:
    table: "rollup_product_day"
    dimensions:
      - "tenant_id"
      - "day"
      - "product_id"
      - "category"
    metrics:
      - "units"
      - "sales"

auth:
  admin_key: "admin-secret-key-12345"
  key_prefix: "tenant-key-"
